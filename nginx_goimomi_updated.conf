server {
    server_name goimomi.com www.goimomi.com 3.27.184.234;

    root /home/ubuntu/project/goimomi-holidays-frontend/dist;
    index index.html;

    # Prevent caching of index.html to ensure users always get the latest build references
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    location / {
        try_files $uri $uri/ /index.html;
        # For other files, standard caching is okay
        expires 1h;
        add_header Cache-Control "public, no-cache";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /media/ {
        alias /home/ubuntu/project/goimomi-holidays-backend/media/;
    }

    location /static/backend/ {
        alias /home/ubuntu/project/goimomi-holidays-backend/static/;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/goimomi.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/goimomi.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.goimomi.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = goimomi.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name goimomi.com www.goimomi.com 3.27.184.234;
    return 404; # managed by Certbot
}
