server {
    listen 80;
    server_name 3.27.184.234 goimomi.com www.goimomi.com;

    # Always redirect to the secure domain
    return 301 https://goimomi.com$request_uri;
}

server {
    listen 443 ssl;
    server_name 3.27.184.234 goimomi.com www.goimomi.com;

    ssl_certificate /etc/letsencrypt/live/goimomi.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/goimomi.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    # Frontend
    location / {
        alias /home/ubuntu/project_goimomi/goimomi-holidays-frontend/dist/;
        try_files $uri $uri/ /index.html;
    }

    # Media files
    location /media/ {
        alias /home/ubuntu/project_goimomi/goimomi-holidays-backend/media/;
    }

    # Static files
    location /static/ {
        alias /home/ubuntu/project_goimomi/goimomi-holidays-backend/static/;
    }

    # Backend API
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Management (Django admin)
    location /management/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
